; The hermes-agent checkout's pyproject.toml [tool.pytest.ini_options] does NOT
; apply to these tests: they live out of tree (in this repo), so pytest's rootdir
; search never reaches it. Declaring our own ini here makes the rootdir and the
; asyncio mode explicit instead of inherited-by-accident.
;
; asyncio_mode = strict matches hermes-agent (which sets no mode, i.e. strict),
; so every coroutine test carries an explicit @pytest.mark.asyncio and nothing
; runs by silent auto-detection.
[pytest]
asyncio_mode = strict
testpaths = .
markers =
    asyncio: async test, run by pytest-asyncio
