name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Hermes Drop
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve latest stable Hermes release
        id: hermes
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Check out stable Hermes
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes.outputs.tag }}
          path: .hermes-agent

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          cache-dependency-glob: .hermes-agent/uv.lock

      - name: Install broker dependencies
        run: npm ci

      - name: Build Hermes test environment
        run: uv sync --project .hermes-agent --extra all --extra dev --locked --no-progress

      - name: Select the Hermes test environment
        run: echo "${{ github.workspace }}/.hermes-agent/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify the whole repository
        env:
          HERMES_AGENT_CHECKOUT: ${{ github.workspace }}/.hermes-agent
        run: npm run verify
